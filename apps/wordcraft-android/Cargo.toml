[package]
name = "wordcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft Android native library & JNI bridge (aarch64-linux-android)"

[lints.rust]
unsafe_code = "allow" # Required for Android NDK C FFI (ANativeWindow) and JNI export entrypoints

[lib]
crate-type = ["cdylib", "rlib"]
name = "wordcraft_android"

[dependencies]
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-formats = { workspace = true }
wordcraft-pdf = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
wgpu = "30"
pollster = "1.0"
raw-window-handle = "0.6"
jni = { version = "0.22", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["nativewindow", "rwh_06", "api-level-26"] }
ndk-sys = "0.6"
android_logger = "0.15"

# cargo-ndk configuration for building jniLibs directly for Gradle
[package.metadata.cargo-ndk]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
output_dir = "android/app/src/main/jniLibs"
